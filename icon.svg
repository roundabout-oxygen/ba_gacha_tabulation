<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Halo Ring Accent -->
  <ellipse cx="256" cy="140" rx="140" ry="24" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.85" filter="url(#glow)"/>
  <ellipse cx="256" cy="140" rx="120" ry="16" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

  <!-- Main 'G' letter with stylized futuristic cut -->
  <path d="M 330 200 A 130 130 0 1 0 350 330 L 270 330 L 270 270 L 370 270 A 150 150 0 1 1 356 160 Z" fill="#ffffff" />

  <!-- Sparkle stars -->
  <polygon points="380,100 388,115 405,120 388,125 380,140 372,125 355,120 372,115" fill="#ffffff" opacity="0.9"/>
  <polygon points="120,380 125,390 140,395 125,400 120,415 115,400 100,395 115,390" fill="#ffffff" opacity="0.7"/>
</svg>
